<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mario Tennis Fever｜接続検証</title><style>
:root{color-scheme:dark;font-family:system-ui,sans-serif}body{margin:0;background:#0c1729;color:#f1f5ff}header,main{max-width:850px;margin:auto;padding:18px}header{border-bottom:1px solid #345}h1{font-size:22px}section{background:#182840;border:1px solid #38516b;border-radius:12px;padding:16px;margin:12px 0}button,input{font:inherit;padding:10px;border-radius:7px;border:1px solid #69809e}button:disabled{opacity:.45;cursor:not-allowed}button{background:#2e6cc3;color:white;cursor:pointer}input{background:#09172a;color:white;max-width:90%}p,small{line-height:1.6}small{color:#b9c9df}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}nav{display:flex;gap:8px;flex-wrap:wrap}nav button:disabled{opacity:.45;cursor:not-allowed}button{background:#29425f}.hidden{display:none}.msg{padding:8px;border-bottom:1px solid #3a5067;white-space:pre-wrap;overflow-wrap:anywhere}#notice{color:#fbd38d}#rooms section{background:#102139}</style></head><body><header><h1>🎾 Mario Tennis Fever｜権限修正版 v2</h1><small>Firebase接続・権限テスト専用。大会本番にはまだ使えません。</small></header><main><p id="notice">Firebase設定を確認中…</p><nav><button data-tab="rules">ルール</button><button data-tab="progress">試合進捗</button><button data-tab="teams">チームメンバー</button><button data-tab="cards">対戦カード</button></nav><div id="rules" class="pane"><section><h2>ルール</h2><p>4チーム・4部門、1勝1pt、同点時は得失ゲーム差。スコアは対戦相手の承認後、運営が確認して公開します。</p></section></div><div id="progress" class="pane hidden"><section><h2>公開試合進捗</h2><div id="publicResults">公開データ待機中</div></section></div><div id="teams" class="pane hidden"><section><h2>チームメンバー</h2><div id="publicTeams">公開データ待機中</div></section></div><div id="cards" class="pane hidden"><section><h2>参加者コードで入室</h2><p>コードは <code>P01-20文字以上のランダム文字列</code> の形式。Firebaseアカウント作成操作は不要。</p><div class="row"><input id="code" type="password" autocomplete="off" placeholder="参加者コード"><button id="login">入室</button><button id="logout">退室</button></div><p id="who"></p></section><div id="rooms"></div></div></main><script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';
import {getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged,setPersistence,browserSessionPersistence} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js';
import {canReport,canReview,validScore,participantCredential,sameReport} from './policy.js';
import {getFirestore,doc,collection,query,where,onSnapshot,updateDoc,addDoc,serverTimestamp,runTransaction} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js';

const $=id=>document.getElementById(id), notice=s=>$('notice').textContent=s;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let auth,db,stopRooms=()=>{},stopPublic=()=>{},stopTeams=()=>{},roomStops=[];
function cleanup(){stopRooms();cleanupRoomViews();}
function tab(name){document.querySelectorAll('.pane').forEach(el=>el.classList.toggle('hidden',el.id!==name));}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>tab(b.dataset.tab));
function err(e){notice('操作できません：'+(e?.code||e?.message||e));}
try {
  const {firebaseConfig}=await import('./firebase-config.js');
  if(firebaseConfig.apiKey==='REPLACE_ME')throw Error('firebase-config.js にFirebase設定を入力してください');
  const app=initializeApp(firebaseConfig);auth=getAuth(app);await setPersistence(auth,browserSessionPersistence);db=getFirestore(app);
  stopPublic=onSnapshot(doc(db,'public','overview'),snap=>{const d=snap.data();$('publicResults').textContent=d?.summary||'公開結果は未登録です';},err);
  stopTeams=onSnapshot(doc(db,'public','teams'),snap=>{const d=snap.data();$('publicTeams').textContent=d?.summary||'チーム情報は未登録です';},err);
  onAuthStateChanged(auth,user=>{cleanup();$('who').textContent=user?'認証済み（'+user.uid.slice(0,8)+'…）':'未入室';if(!user){notice('公開画面は閲覧できます。対戦カードは参加者コードが必要です。');return;}
    notice('参加者認証済み。自分の対戦カードを読み込みます。');
    stopRooms=onSnapshot(query(collection(db,'rooms'),where('memberUids','array-contains',user.uid)),snapshot=>{
      cleanupRoomViews();if(snapshot.empty)$('rooms').textContent='割り当てられた試合はありません。運営にUID登録をご確認ください。';snapshot.forEach(room=>renderRoom(room.id,room.data(),user.uid));
    },err);
  });
  $('login').onclick=async()=>{try{const {email,password}=participantCredential($('code').value);await signInWithEmailAndPassword(auth,email,password);$('code').value='';}catch(e){err(e)}};
  $('logout').onclick=()=>signOut(auth).catch(err);
}catch(e){err(e)}
function cleanupRoomViews(){roomStops.forEach(fn=>fn());roomStops=[];$('rooms').replaceChildren();}
function renderRoom(id,d,uid){const section=document.createElement('section');section.innerHTML=`<h3>${esc(d.title||id)}</h3><p>状態：<b class="status">${esc(d.status)}</b></p><p class="score">${d.status==='unreported'?'未報告':esc(d.scoreA)+' - '+esc(d.scoreB)}</p><div class="row"><input class="a" type="number" min="0" max="99" placeholder="A"><input class="b" type="number" min="0" max="99" placeholder="B"><button class="report">結果報告</button><button class="approve">承認</button><button class="fix">訂正依頼</button></div><h4>試合チャット</h4><div class="messages"></div><div class="row"><input class="body" maxlength="300" placeholder="メッセージ"><button class="send">送信</button></div>`;$('rooms').append(section);
 const roomRef=doc(db,'rooms',id),score=validScore;
 section.querySelector('.report').disabled=!canReport(d,uid);
 section.querySelector('.approve').disabled=!canReview(d,uid);
 section.querySelector('.fix').disabled=!canReview(d,uid);
 section.querySelector('.report').onclick=async()=>{try{if(!canReport(d,uid))throw Error('現在は報告できません');const av=section.querySelector('.a').value,bv=section.querySelector('.b').value,a=Number(av),b=Number(bv);if(!av||!bv||!score(a,b))throw Error('異なる0〜99の整数を入力してください');await updateDoc(roomRef,{scoreA:a,scoreB:b,status:'pending',reportedBy:uid,approvedBy:'',updatedAt:serverTimestamp()});}catch(e){err(e)}};
 section.querySelector('.approve').onclick=()=>review('confirmed');
 section.querySelector('.fix').onclick=()=>review('needs_fix');
 async function review(status){
   try {await runTransaction(db,async transaction=>{
     const snap=await transaction.get(roomRef),current=snap.data();
     if(!current || !canReview(current,uid) || !sameReport(d,current))
       throw Error('報告内容が更新されました。最新のスコアを確認してから操作してください');
     transaction.update(roomRef,{status,approvedBy:status==='confirmed'?uid:'',updatedAt:serverTimestamp()});
   });}catch(e){err(e)}
 }
 section.querySelector('.send').onclick=async()=>{try{const input=section.querySelector('.body'),body=input.value.trim();if(!body||body.length>300)throw Error('1〜300文字で入力');await addDoc(collection(db,'rooms',id,'chat'),{uid,name:'参加者',body,at:serverTimestamp()});input.value='';}catch(e){err(e)}};
 roomStops.push(onSnapshot(query(collection(db,'rooms',id,'chat')),snap=>{const box=section.querySelector('.messages');box.replaceChildren();snap.docs.sort((a,b)=>(a.data().at?.seconds||0)-(b.data().at?.seconds||0)).forEach(m=>{const p=document.createElement('div');p.className='msg';p.textContent=m.data().body;box.append(p)});},err));
}
</script></body></html>
